<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="1;url=02_App/index.html">
  <title>Chuyển hướng — Tra cứu TTHC xã Phú Thành</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .warning {
      background: #c0392b;
      color: #fff;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 32px;
      border-radius: 8px;
      max-width: 600px;
    }
    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      color: #666;
      margin-bottom: 24px;
    }
    a {
      display: inline-block;
      background: #2980b9;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      background: #1a5276;
    }
  </style>
</head>
<body>
  <div class="warning">
    BẢN NHÁP NỘI BỘ — chỉ dùng để lấy ý kiến cán bộ xã.<br>
    KHÔNG chia sẻ cho người dân. Chưa có hồ sơ an toàn thông tin.
  </div>
  <h1>Đang chuyển hướng...</h1>
  <p>Bạn sẽ được chuyển đến trang tra cứu sau 1 giây.</p>
